services:
  # Postgres is NOT included here — the app connects to Neon DB via DATABASE_URL in .env.
  # Only Redis is run locally; it is still required for sessions, rate limiting, and BullMQ.

  redis:
    image: redis:7-alpine
    container_name: postly-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: postly-app
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Route Redis to the compose service — everything else (DATABASE_URL, secrets)
      # comes from .env unchanged, so the app talks to Neon DB directly.
      REDIS_URL: redis://redis:6379
    ports:
      - "${PORT:-3000}:3000"

volumes:
  redis_data:
