services:
  # Postgres is NOT included here — the app connects to Neon DB via DATABASE_URL in .env.
  # Only Redis is run locally; it is still required for sessions, rate limiting, and BullMQ.

  redis:
    image: redis:7-alpine
    container_name: postly-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: node src/processes/api.js
    container_name: postly-api
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
    expose:
      - "${PORT:-3000}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${PORT:-3000}/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: node src/processes/worker.js
    container_name: postly-worker
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
    # deploy:
    #   replicas: 1
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${WORKER_HEALTH_PORT:-3001}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  bot:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: node src/processes/bot.js
    container_name: postly-bot
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${BOT_HEALTH_PORT:-3002}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  redis_data:
